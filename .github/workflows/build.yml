name: Autobuild
# modified from https://github.com/nosoop/NinjaBuild-SMPlugin/blob/master/contrib/github-workflow/build-on-version-tag-push.yml

on:
  push:
    tags:
    - 'v*'

jobs:
  run:
    name: Run action
    runs-on: ubuntu-latest

    # skip build on '[ci skip]'
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v4

    - name: Setup SourcePawn Compiler
      uses: rumblefrog/setup-sp@master
      with:
        version: "1.12.x"

    - name: Compile plugins
      run: |
        mkdir -p plugins
        spcomp -i"./scripting/include/" scripting/chatlog.sp -o ./plugins/chatlog.smx
        test -s plugins/chatlog.smx

    - name: Zip packages
      run: |
        mkdir build
        7za a -r build/chatlog.zip plugins/ scripting/

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./build/chatlog.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
